<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: radial-gradient(circle at 20% 20%, #111827, #030712 70%);
      }

      .board-square {
        transition: background-color 0.2s ease, transform 0.12s ease;
      }

      .board-square:hover {
        transform: translateY(-1px);
      }

      .piece {
        width: 86%;
        height: 86%;
        transition: transform 0.2s ease, filter 0.2s ease;
        pointer-events: none;
        user-select: none;
        object-fit: contain;
      }

      .piece.selected {
        transform: scale(1.05);
        filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.95));
      }

      .last-move::after,
      .move-hint::after,
      .capture-hint::after,
      .check-king::after,
      .selected-square::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .selected-square::before {
        box-shadow: inset 0 0 0 3px rgba(99, 102, 241, 0.85);
      }

      .move-hint::after {
        inset: 35%;
        border-radius: 9999px;
        background: rgba(34, 197, 94, 0.45);
        box-shadow: 0 0 12px rgba(34, 197, 94, 0.55);
      }

      .capture-hint::after {
        inset: 8%;
        border-radius: 9999px;
        border: 4px solid rgba(239, 68, 68, 0.8);
        box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
      }

      .last-move::after {
        background: rgba(251, 191, 36, 0.28);
        animation: pulseFade 0.7s ease;
      }

      .check-king::after {
        background: rgba(239, 68, 68, 0.35);
        box-shadow: inset 0 0 0 3px rgba(220, 38, 38, 0.65);
      }

      @keyframes pulseFade {
        0% { opacity: 0.85; }
        100% { opacity: 0.4; }
      }

      .trail {
        position: absolute;
        inset: 0;
        border: 2px dashed rgba(251, 191, 36, 0.75);
        animation: trailFade 0.5s ease-out forwards;
        pointer-events: none;
      }

      @keyframes trailFade {
        0% { opacity: 0.85; transform: scale(1.02); }
        100% { opacity: 0; transform: scale(1); }
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen">
    <main class="max-w-6xl mx-auto px-4 py-6 md:py-10">
      <h1 class="text-3xl md:text-4xl font-bold text-center tracking-wide mb-6">♟ Vanilla Chess</h1>

      <section class="grid gap-6 lg:grid-cols-[minmax(280px,640px)_1fr] items-start">
        <div>
          <div id="board" class="grid grid-cols-8 aspect-square rounded-2xl overflow-hidden shadow-2xl border border-slate-700"></div>
        </div>

        <aside class="bg-slate-900/70 border border-slate-700 rounded-2xl p-4 md:p-5 backdrop-blur-sm space-y-4">
          <div class="flex items-center justify-between gap-3">
            <p class="text-sm uppercase tracking-wider text-slate-400">Mode</p>
            <button id="aiToggle" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition text-sm font-semibold">AI: Off</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button id="undoBtn" class="px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition text-sm font-semibold">Undo</button>
            <button id="restartBtn" class="px-3 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 transition text-sm font-semibold">Restart</button>
          </div>

          <div class="rounded-lg bg-slate-800/80 p-3">
            <p class="text-xs uppercase text-slate-400 tracking-wider mb-1">Status</p>
            <p id="status" class="font-medium">White to move</p>
            <p id="detail" class="text-sm text-slate-300 mt-1">Select a piece to start.</p>
          </div>

          <div class="rounded-lg bg-slate-800/80 p-3">
            <p class="text-xs uppercase text-slate-400 tracking-wider mb-2">Move History</p>
            <ol id="history" class="text-sm space-y-1 max-h-72 overflow-auto pr-2"></ol>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="./js/ui.js"></script>
  </body>
</html>
